<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Data Pulses along Paths -->
    <style>
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodeFloat1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes nodeFloat2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      .flowing-wire {
        stroke-dasharray: 8 12;
        animation: flowDash 2s linear infinite;
      }
      .floating-node-1 {
        animation: nodeFloat1 4s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: nodeFloat2 5s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Architecture Visual Grid Lines (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- DYNAMIC BACKGROUND FLOW PIPELINES (Behind Text) -->
  <g stroke-width="3" fill="none">
    <!-- Connecting Wire 1 -->
    <path d="M 80 100 C 250 40, 350 280, 550 220 S 850 80, 1120 120" stroke="#38bdf8" stroke-opacity="0.25"/>
    <path d="M 80 100 C 250 40, 350 280, 550 220 S 850 80, 1120 120" stroke="#38bdf8" stroke-opacity="0.9" class="flowing-wire"/>

    <!-- Connecting Wire 2 -->
    <path d="M 120 230 C 300 290, 450 60, 700 100 S 950 260, 1100 220" stroke="#c084fc" stroke-opacity="0.25"/>
    <path d="M 120 230 C 300 290, 450 60, 700 100 S 950 260, 1100 220" stroke="#c084fc" stroke-opacity="0.9" class="flowing-wire" style="animation-duration: 3s;"/>
  </g>

  <!-- DYNAMIC NODES (Positioned along perimeter so title and subtitle remain in foreground and unobstructed) -->
  <!-- Left Top Node: Decoupled Frontend -->
  <g class="floating-node-1" transform="translate(60, 60)">
    <rect x="0" y="0" width="140" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="25" cy="25" r="8" fill="#38bdf8"/>
    <text x="42" y="29" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Storefront UI</text>
  </g>

  <!-- Left Bottom Node: Cart & Checkout Engine -->
  <g class="floating-node-2" transform="translate(80, 200)">
    <rect x="0" y="0" width="145" height="50" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="8" fill="#c084fc"/>
    <text x="42" y="29" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Cart &amp; Checkout</text>
  </g>

  <!-- Right Top Node: Commerce APIs -->
  <g class="floating-node-2" transform="translate(980, 70)">
    <rect x="0" y="0" width="145" height="50" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="25" cy="25" r="8" fill="#34d399"/>
    <text x="42" y="29" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Commerce APIs</text>
  </g>

  <!-- Right Bottom Node: Edge / SSR Engine -->
  <g class="floating-node-1" transform="translate(980, 210)">
    <rect x="0" y="0" width="145" height="50" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="8" fill="#f43f5e"/>
    <text x="42" y="29" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Edge SSR / CDN</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed high visibility and contrast) -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 55)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="0" y="5" class="badge-text" text-anchor="middle">🛍️ COMPOSABLE STOREFRONTS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" class="title-text" font-size="40" letter-spacing="-0.5">Awesome Headless Commerce</text>

    <!-- Subtitle -->
    <text x="600" y="195" class="subtitle-text" font-size="18">
      Curated Frameworks, Decoupled Storefronts &amp; API-First Commerce Toolkits
    </text>

    <!-- Tech Stack Feature Pills -->
    <g transform="translate(600, 250)">
      <!-- Pill 1: Next.js Commerce -->
      <rect x="-295" y="-14" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="-230" y="4" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="500">Next.js Commerce</text>

      <!-- Pill 2: Hydrogen -->
      <rect x="-150" y="-14" width="85" height="28" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="-107.5" y="4" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="500">Hydrogen</text>

      <!-- Pill 3: Nuxt / Vue -->
      <rect x="-50" y="-14" width="95" height="28" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="-2.5" y="4" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="500">Nuxt / Vue</text>

      <!-- Pill 4: SvelteKit -->
      <rect x="60" y="-14" width="85" height="28" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="102.5" y="4" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="500">SvelteKit</text>

      <!-- Pill 5: Astro & Remix -->
      <rect x="160" y="-14" width="115" height="28" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="217.5" y="4" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="500">Astro &amp; Remix</text>
    </g>
  </g>
</svg>
