<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#10192e" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Blurred Glow Spots (Background Depth) -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="cx" values="180;240;180" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="280" r="160" fill="#ec4899" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="cy" values="280;220;280" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="320" r="120" fill="#06b6d4" opacity="0.1" filter="url(#softGlow)">
    <animate attributeName="r" values="120;150;120" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Geometric Grid Pattern (Subtle Architecture Representation) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Data Flow Line (Decoupled Frontend <-> Backend APIs) -->
  <g opacity="0.4">
    <path d="M 50 40 Q 300 90 600 40 T 1150 40" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M 50 320 Q 300 270 600 320 T 1150 320" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="120" cy="180" r="3" fill="#6366f1" opacity="0.6">
    <animate attributeName="cy" values="180;160;180" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="280" cy="310" r="2.5" fill="#a855f7" opacity="0.5">
    <animate attributeName="cy" values="310;290;310" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="90" r="3" fill="#ec4899" opacity="0.6">
    <animate attributeName="cy" values="90;110;90" dur="4.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1080" cy="220" r="2.5" fill="#06b6d4" opacity="0.5">
    <animate attributeName="cy" values="220;200;220" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, non-overlapping with dynamic elements -->
  <!-- Top Category Badge -->
  <g transform="translate(600, 52)">
    <rect x="-145" y="-14" width="290" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="-122" cy="0" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-110" y="4.5" fill="#c7d2fe" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Title: Clear, High Contrast, Centered in Foreground -->
  <text x="600" y="125" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Headless Commerce
  </text>
  <text x="600" y="165" text-anchor="middle" font-size="28" font-weight="700" fill="url(#primaryGrad)" letter-spacing="0.2">
    Frameworks &amp; Composable Storefronts
  </text>

  <!-- Subtitle -->
  <text x="600" y="205" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
    Architecting Modern Decoupled Commerce • API-First Platforms • High-Performance Frameworks
  </text>

  <!-- Foreground Pill Tags (Clean UI presentation) -->
  <g transform="translate(195, 245)">
    <!-- Pill 1: Next.js & React -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#38bdf8" />
      <text x="35" y="22.5" fill="#e2e8f0" font-size="13" font-weight="600">Next.js &amp; React</text>
    </g>

    <!-- Pill 2: Shopify Hydrogen -->
    <g transform="translate(200, 0)">
      <rect width="195" height="36" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#10b981" />
      <text x="35" y="22.5" fill="#e2e8f0" font-size="13" font-weight="600">Shopify Hydrogen</text>
    </g>

    <!-- Pill 3: Vue & Nuxt.js -->
    <g transform="translate(415, 0)">
      <rect width="185" height="36" rx="18" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#a855f7" />
      <text x="35" y="22.5" fill="#e2e8f0" font-size="13" font-weight="600">Vue &amp; Nuxt Commerce</text>
    </g>

    <!-- Pill 4: Astro & Svelte -->
    <g transform="translate(620, 0)">
      <rect width="190" height="36" rx="18" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="20" cy="18" r="5" fill="#f59e0b" />
      <text x="35" y="22.5" fill="#e2e8f0" font-size="13" font-weight="600">Astro &amp; SvelteKit</text>
    </g>
  </g>

  <!-- Bottom Interactive Status Bar -->
  <g transform="translate(600, 318)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="12" font-weight="500">
      ⚡ Ultra-Fast Core Web Vitals &nbsp;•&nbsp; 🔗 Multi-Backend Connectors &nbsp;•&nbsp; 🚀 Edge-Ready Deployment
    </text>
  </g>
</svg>
